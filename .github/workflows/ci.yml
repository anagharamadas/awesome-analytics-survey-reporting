name: CI

# The point of this workflow is evidence, not decoration. The PR under review
# in task-b/ shipped with "tests pass" as its entire description, and its tests
# pass while asserting almost nothing. So each job below states what it would
# actually have caught.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: "backend: normalize contract + ingest against real Postgres"
    runs-on: ubuntu-latest

    # A real Postgres, not SQLite. The schema leans on CHECK constraints,
    # TIMESTAMPTZ, AT TIME ZONE, percentile_cont and an INCLUDE index -- on
    # SQLite most of those are silently ignored, so a green build would prove
    # nothing about the thing being graded.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aa
          POSTGRES_PASSWORD: aa
          POSTGRES_DB: surveys
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aa -d surveys"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://aa:aa@localhost:5432/surveys
      DATA_DIR: ${{ github.workspace }}/data

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Tests
        working-directory: backend
        # Catches: a regression in the three graded pure functions. The empty
        # marker set, day-first parsing, the leap-year reject, and the
        # deliberate choice to return -2400 rather than reject it.
        run: pytest -q

      - name: Ingest is idempotent
        working-directory: backend
        # Catches the single hardest requirement to verify by eye: "re-running
        # the ingest on the same file must not double the data". Runs it twice
        # and fails if any table's row count moved on the second pass.
        run: |
          python -m app.ingest
          python - <<'PY' > /tmp/counts-1.txt
          from app.db import engine
          from sqlalchemy import text
          with engine.connect() as c:
              for t in ("clients", "surveys", "respondents", "responses"):
                  print(t, c.execute(text(f"SELECT count(*) FROM {t}")).scalar())
          PY
          python -m app.ingest
          python - <<'PY' > /tmp/counts-2.txt
          from app.db import engine
          from sqlalchemy import text
          with engine.connect() as c:
              for t in ("clients", "surveys", "respondents", "responses"):
                  print(t, c.execute(text(f"SELECT count(*) FROM {t}")).scalar())
          PY
          echo "--- run 1 ---"; cat /tmp/counts-1.txt
          echo "--- run 2 ---"; cat /tmp/counts-2.txt
          diff /tmp/counts-1.txt /tmp/counts-2.txt \
            || { echo "::error::ingest is not idempotent - row counts changed"; exit 1; }

      - name: rejects.csv is reproducible
        working-directory: backend
        # Catches a non-deterministic duplicate-resolution rule (ADR 0003).
        # If the committed rejects.csv does not match a fresh run, the tie-break
        # is not a total order and the report can silently change between runs.
        run: |
          git diff --exit-code -- ../rejects.csv \
            || { echo "::error::rejects.csv differs from a fresh ingest run"; exit 1; }

  frontend:
    name: "frontend: typecheck + build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install
        working-directory: frontend
        run: npm install

      - name: Typecheck and build
        working-directory: frontend
        # Catches the class of bug the PR in task-b/ is full of: a nullable
        # field read as if it were always present. types.ts declares
        # completion_rate and median_duration_seconds as `number | null`, so
        # tsc fails the build if the table renders one without handling null.
        run: npm run build
